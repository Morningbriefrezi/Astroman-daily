name: Daily Telegram Briefing

on:
  schedule:
    # Runs every day at 08:00 Tbilisi time (05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Pick random morning briefing
        run: |
          python3 - << 'PY'
          import random, subprocess

          scripts = [
            
              "english_daily_briefing.py",
              "astroman_morning_routine_ka_15.py",
          ]

          chosen = random.choice(scripts)
          print(f"📨 Running: {chosen}")
          subprocess.check_call(["python3", chosen])
          PY
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
