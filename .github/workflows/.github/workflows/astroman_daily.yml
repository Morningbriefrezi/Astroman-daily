name: ASTROMAN Daily Business Briefing

on:
  schedule:
    # Runs every day at 8:00 AM Tbilisi time (3:00 AM UTC)
    - cron: '0 5 * * *'
  
  workflow_dispatch:  # Allows manual trigger for testing

jobs:
  send-astroman-briefing:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Send ASTROMAN morning briefing
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python astroman_morning_routine_ka_15.py
```

4. Click **"Commit changes"**

### Step 4: Your Secrets Are Already Set! ✅
You already have:
- ✅ TELEGRAM_BOT_TOKEN
- ✅ TELEGRAM_CHAT_ID

So you're good to go!

### Step 5: Test It NOW!
1. Go to **"Actions"** tab
2. Click **"ASTROMAN Daily Business Briefing"** (on the left)
3. Click **"Run workflow"** → **"Run workflow"**
4. Wait 30-60 seconds
5. **Check your Telegram!** 🎉

